html/head_include="<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no\">
<style>
  canvas { touch-action: none; }
  #status-splash, #status > img, .godot-splash { display: none !important; }
  #geotap-loader {
    position: fixed;
    top: 30%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    font-family: -apple-system, system-ui, sans-serif;
    z-index: 1000;
    pointer-events: none;
    transition: opacity .4s;
  }
  #geotap-loader h1 { font-size: 48px; font-weight: 700; letter-spacing: 8px; color: #b9d2ff; margin: 0; white-space: nowrap; }
  #geotap-loader p { font-size: 14px; color: #6a8ec0; margin: 8px 0 0; white-space: nowrap; }
  #geotap-loader.hidden { opacity: 0; }
</style>
<script>
  (function() {
    var d = document.createElement('div');
    d.id = 'geotap-loader';
    d.innerHTML = '<h1>GEOTAP</h1><p>Loading globe...</p>';
    (document.body || document.documentElement).appendChild(d);
  })();
  window.addEventListener('load', function() {
    var iv = setInterval(function() {
      var s = document.getElementById('status');
      var hidden = !s || s.style.display === 'none' || getComputedStyle(s).display === 'none';
      if (hidden) {
        var l = document.getElementById('geotap-loader');
        if (l) {
          l.classList.add('hidden');
          setTimeout(function() { l && l.remove(); }, 500);
        }
        clearInterval(iv);
      }
    }, 200);
  });
</script>
